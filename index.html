<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="stylesheet" href="style.css">
  <title>Four-in-a-row</title>

  <!-- Import map (ready for esm.sh libs) -->
  <script type="importmap">
  {
    "imports": {
      "nipplejs": "https://esm.sh/nipplejs"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <div id="controls">
      <div id="turnIndicator" aria-live="polite"></div>
      <button id="restart" aria-label="Restart game">Restart</button>
    </div>

    <div id="boardContainer" role="application" aria-label="Four in a row board"></div>

    <!-- Remotion player mount area (hidden by default) -->
    <div id="replayArea" style="width:100%;max-width:480px;margin-top:12px;display:none;"></div>
  </main>

  <script type="module" src="app.js"></script>
  <script type="module" src="remotion_player.js"></script>
